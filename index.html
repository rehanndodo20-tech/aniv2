<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Opname</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
      padding-bottom: 80px;
    }

    .top {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 12px 14px;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    #search {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    .tabs { display: flex; gap: 6px; margin-top: 10px; }

    .tab {
      flex: 1;
      padding: 7px 4px;
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      color: #222;
      line-height: 1.3;
    }
    .tab b { display: block; font-size: 16px; }
    .tab.active { background: #222; color: #fff; border-color: #222; }

    main { padding: 10px 14px; }

    #list { list-style: none; margin: 0; padding: 0; }

    .item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .item .no { width: 24px; font-size: 12px; color: #888; text-align: right; }
    .item .name { flex: 1; font-size: 15px; word-break: break-word; }

    .item input {
      padding: 9px 6px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
      text-align: center;
    }

    .item .qty { width: 64px; }
    .item .unit { width: 62px; }

    .item .calc-btn {
      width: 40px;
      height: 40px;
      font-size: 18px;
      border: 1px solid #bbb;
      background: #f4f4f4;
      border-radius: 6px;
    }

    .empty { text-align: center; color: #777; }

    .bottom {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .btn {
      flex: 1;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 8px;
    }
    .btn.primary { background: #222; color: #fff; border-color: #222; }
    .btn.danger { color: #b00020; border-color: #b00020; }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 30;
    }
    .toast[hidden] { display: none; }

    /* Kalkulator */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .overlay[hidden] { display: none; }

    .calc {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 14px 14px 0 0;
      padding: 14px;
    }

    .calc-title { font-size: 14px; color: #666; margin-bottom: 6px; }

    .calc-screen {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 14px;
      font-size: 28px;
      text-align: right;
      min-height: 60px;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .keys button {
      padding: 16px 0;
      font-size: 20px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
    }
    .keys .op { background: #eee; }
    .keys .fn { background: #ddd; }
    .keys .eq { background: #222; color: #fff; }
    .keys .wide { grid-column: span 2; }
    .keys .tall { grid-row: span 2; }

    .calc-actions { display: flex; gap: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>STOCK OPNAME</h1>
    <input type="search" id="search" placeholder="Cari barang..." autocomplete="off">
    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-f="all">Semua<b id="cAll">0</b></button>
      <button type="button" class="tab" data-f="filled">Sudah Terisi<b id="cFilled">0</b></button>
      <button type="button" class="tab" data-f="empty">Belum Terisi<b id="cEmpty">0</b></button>
    </div>
  </header>

  <main>
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Barang tidak ditemukan.</p>
  </main>

  <footer class="bottom">
    <button id="copyBtn" class="btn primary">Salin Hasil</button>
    <button id="resetBtn" class="btn danger">Reset</button>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <!-- Kalkulator -->
  <div id="calcOverlay" class="overlay" hidden>
    <div class="calc">
      <div class="calc-title" id="calcTitle">Kalkulator</div>
      <div class="calc-screen" id="calcScreen">0</div>
      <div class="keys" id="keys">
        <button data-k="C" class="fn">C</button>
        <button data-k="DEL" class="fn">⌫</button>
        <button data-k="÷" class="op">÷</button>
        <button data-k="×" class="op">×</button>

        <button data-k="7">7</button>
        <button data-k="8">8</button>
        <button data-k="9">9</button>
        <button data-k="-" class="op">−</button>

        <button data-k="4">4</button>
        <button data-k="5">5</button>
        <button data-k="6">6</button>
        <button data-k="+" class="op">+</button>

        <button data-k="1">1</button>
        <button data-k="2">2</button>
        <button data-k="3">3</button>
        <button data-k="=" class="eq tall">=</button>

        <button data-k="0" class="wide">0</button>
        <button data-k=",">,</button>
      </div>
      <div class="calc-actions">
        <button id="calcClose" class="btn">Tutup</button>
        <button id="calcUse" class="btn primary">Gunakan Hasil</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Daftar barang tetap (59 barang, urutan sesuai daftar asli) =====
    var ITEMS = [
      "Air galon", "Avocado", "Banana", "Biskuit Lotus", "Biskuit Regal", "Buah leci",
      "Butter ancor", "Coffee Beans (Mura bika)", "Coffee Beans robusta (Kopitiam)",
      "Coffee Beans specialty", "Dragon fruit", "Diamon apel", "F,n", "Freshmilk", "Guava",
      "Guest Beans (manual brew)", "Gula aren", "Gula pasir", "Krimer bubuk", "Mango", "Milo",
      "Oatmilk", "Paper filter", "Powder blackcurrant tea", "Powder Charcoal",
      "Powder chocolate", "Powder matcha", "Pristine", "SKM", "Saus butterscoth", "Sea salt",
      "Selai strawberry", "Sprite", "Strawberry", "Sunquick jeruk", "Sunquick mangga",
      "Syrup blue Citrus", "Syrup caramel", "Syrup hazelnut", "Syrup leci", "Syrup mint",
      "Syrup pandan", "Syrup passion fruit", "Syrup pistachio", "Syrup vanilla",
      "Teh chamomile", "Teh Earl grey", "Teh English", "Teh lipton", "Teh tarik",
      "Wedang jahe", "Wedang uwuh", "Whipping cream", "Yakult", "Naga pisang",
      "Strawberry pisang", "Goldenfil", "Sirsak", "Richmilk"
    ];

    var STORAGE_KEY = "stock-opname-data";

    // Data tersimpan: { "Freshmilk": { qty: "3", unit: "kotak" }, ... }
    var data = {};
    try {
      data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      data = {};
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    // ===== Tampilkan list =====
    var listEl = document.getElementById("list");
    var emptyEl = document.getElementById("empty");

    function esc(text) {
      return text.replace(/&/g, "&amp;").replace(/"/g, "&quot;")
                 .replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function render() {
      listEl.innerHTML = ITEMS.map(function (name, i) {
        var d = data[name] || { qty: "", unit: "" };
        return (
          '<li class="item" data-i="' + i + '">' +
            '<span class="no">' + (i + 1) + '</span>' +
            '<span class="name">' + esc(name) + '</span>' +
            '<input class="qty" type="text" inputmode="decimal" placeholder="0" value="' + esc(d.qty) + '">' +
            '<input class="unit" type="text" placeholder="satuan" value="' + esc(d.unit) + '">' +
            '<button class="calc-btn" type="button">🧮</button>' +
          '</li>'
        );
      }).join("");
    }

    // Simpan saat mengetik
    listEl.addEventListener("input", function (e) {
      var li = e.target.closest(".item");
      if (!li) return;
      var name = ITEMS[li.dataset.i];
      if (!data[name]) data[name] = { qty: "", unit: "" };
      if (e.target.classList.contains("qty")) data[name].qty = e.target.value;
      if (e.target.classList.contains("unit")) data[name].unit = e.target.value;
      save();
      updateCounts();
    });

    // Buka kalkulator
    listEl.addEventListener("click", function (e) {
      if (!e.target.classList.contains("calc-btn")) return;
      var li = e.target.closest(".item");
      openCalc(Number(li.dataset.i));
    });

    // ===== Pencarian + filter status (hanya menyembunyikan, data tidak dihapus) =====
    var searchEl = document.getElementById("search");
    var currentFilter = "all"; // all | filled | empty

    function normalize(s) {
      return s.toLowerCase().replace(/\s+/g, "");
    }

    function isFilled(name) {
      return !!(data[name] && data[name].qty.trim() !== "");
    }

    function updateCounts() {
      var filled = ITEMS.filter(isFilled).length;
      document.getElementById("cAll").textContent = ITEMS.length;
      document.getElementById("cFilled").textContent = filled;
      document.getElementById("cEmpty").textContent = ITEMS.length - filled;
    }

    function applyFilter() {
      var q = normalize(searchEl.value);
      var shown = 0;
      document.querySelectorAll(".item").forEach(function (li) {
        var name = ITEMS[li.dataset.i];
        var matchSearch = normalize(name).indexOf(q) !== -1;
        var matchStatus =
          currentFilter === "all" ||
          (currentFilter === "filled" && isFilled(name)) ||
          (currentFilter === "empty" && !isFilled(name));
        var show = matchSearch && matchStatus;
        li.style.display = show ? "" : "none";
        if (show) shown++;
      });
      emptyEl.hidden = shown > 0;
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".tab").forEach(function (b) {
        b.classList.toggle("active", b.dataset.f === f);
      });
      applyFilter();
    }

    searchEl.addEventListener("input", applyFilter);

    document.getElementById("tabs").addEventListener("click", function (e) {
      var b = e.target.closest(".tab");
      if (b) setFilter(b.dataset.f);
    });

    // ===== Kalkulator =====
    var overlay = document.getElementById("calcOverlay");
    var screenEl = document.getElementById("calcScreen");
    var titleEl = document.getElementById("calcTitle");
    var expr = "";
    var calcIndex = null;

    function showExpr() {
      screenEl.textContent = expr === "" ? "0" : expr;
    }

    function openCalc(i) {
      calcIndex = i;
      expr = (data[ITEMS[i]] && data[ITEMS[i]].qty) || "";
      titleEl.textContent = ITEMS[i];
      showExpr();
      overlay.hidden = false;
    }

    function closeCalc() {
      overlay.hidden = true;
      calcIndex = null;
    }

    // Hitung ekspresi tanpa eval
    function compute(text) {
      var clean = text.replace(/,/g, ".").replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
      if (!/^[0-9.+\-*\/]+$/.test(clean)) return null;
      try {
        var result = Function('"use strict"; return (' + clean + ")")();
        if (typeof result !== "number" || !isFinite(result)) return null;
        return String(Math.round(result * 10000) / 10000).replace(".", ",");
      } catch (e) {
        return null;
      }
    }

    document.getElementById("keys").addEventListener("click", function (e) {
      var k = e.target.dataset.k;
      if (!k) return;
      if (k === "C") {
        expr = "";
        showExpr();
      } else if (k === "DEL") {
        expr = expr.slice(0, -1);
        showExpr();
      } else if (k === "=") {
        var r = compute(expr);
        if (r === null) {
          screenEl.textContent = "Error";
          expr = "";
        } else {
          expr = r;
          showExpr();
        }
      } else {
        expr += k;
        showExpr();
      }
    });

    document.getElementById("calcClose").addEventListener("click", closeCalc);

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeCalc();
    });

    document.getElementById("calcUse").addEventListener("click", function () {
      var value = expr;
      if (/[+\-×÷]/.test(expr.replace(/^-/, ""))) {
        var r = compute(expr);
        if (r === null) { toast("Hitungan belum valid"); return; }
        value = r;
      }
      var name = ITEMS[calcIndex];
      if (!data[name]) data[name] = { qty: "", unit: "" };
      data[name].qty = value;
      save();
      var input = document.querySelector('.item[data-i="' + calcIndex + '"] .qty');
      if (input) input.value = value;
      updateCounts();
      closeCalc();
    });

    // ===== Salin hasil (hanya barang yang diisi, sesuai urutan daftar) =====
    function buildText() {
      var lines = [];
      ITEMS.forEach(function (name) {
        var d = data[name];
        if (d && d.qty.trim() !== "") {
          lines.push(name + ": " + d.qty.trim() + (d.unit.trim() ? " " + d.unit.trim() : ""));
        }
      });
      return lines.join("\n");
    }

    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    document.getElementById("copyBtn").addEventListener("click", function () {
      var text = buildText();
      if (!text) { toast("Belum ada data yang diisi"); return; }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          function () { toast("Hasil disalin"); },
          function () { fallbackCopy(text); toast("Hasil disalin"); }
        );
      } else {
        fallbackCopy(text);
        toast("Hasil disalin");
      }
    });

    // ===== Reset =====
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (confirm("Hapus semua data dan mulai Stock Opname baru?")) {
        data = {};
        save();
        searchEl.value = "";
        render();
        updateCounts();
        setFilter("all");
        toast("Data direset");
      }
    });

    // ===== Pesan kecil =====
    var toastTimer;
    function toast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.hidden = true; }, 2000);
    }

    render();
    updateCounts();
  </script>
</body>
  </html>
